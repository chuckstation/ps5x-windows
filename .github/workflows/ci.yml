name: PS5x CI (Windows)

on:
  push:
    branches: [main, develop]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build-release:
    name: Build PS5x Release (Windows x64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC Release)
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPS5X_ENABLE_DX12=ON `
            -DPS5X_ENABLE_DX11=ON `
            -DPS5X_ENABLE_CRASH_HANDLER=ON `
            -DPS5X_ENABLE_METRICS=ON `
            -DPS5X_ENABLE_SAVESTATES=ON `
            -DPS5X_ENABLE_INPUT_MAPPING=ON

      - name: Build
        run: cmake --build build --config Release --parallel
