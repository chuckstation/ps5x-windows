name: PS5x CI (Windows)

on:
  push:
    branches: [main, develop]
    tags:     ['v*']
  pull_request:
    branches: [main]

# PS5x v1.0.0 — targets Windows (primary). DirectX 12 is the primary graphics backend.
# Repository: https://github.com/libaerto/ps5x-windows

jobs:

  # ── Build + Test (Debug & Release, MSVC) ──────────────────────────────
  build-test-msvc:
    name: MSVC ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPS5X_BUILD_TESTS=ON `
            -DPS5X_WARNINGS_AS_ERRORS=ON `
            -DPS5X_ENABLE_DX12=ON `
            -DPS5X_ENABLE_DX11=ON `
            -DPS5X_ENABLE_CRASH_HANDLER=ON `
            -DPS5X_ENABLE_METRICS=ON `
            -DPS5X_ENABLE_SAVESTATES=ON `
            -DPS5X_ENABLE_INPUT_MAPPING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure --parallel 4

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-msvc-${{ matrix.build_type }}
          path: build/Testing/

  # ── Build + Test (Debug & Release, Clang-cl) ──────────────────────────
  build-test-clang:
    name: Clang-cl ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (clang-cl)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DPS5X_BUILD_TESTS=ON ^
            -DPS5X_WARNINGS_AS_ERRORS=ON ^
            -DPS5X_ENABLE_DX12=ON ^
            -DPS5X_ENABLE_DX11=ON ^
            -DPS5X_ENABLE_CRASH_HANDLER=ON ^
            -DPS5X_ENABLE_METRICS=ON ^
            -DPS5X_ENABLE_SAVESTATES=ON ^
            -DPS5X_ENABLE_INPUT_MAPPING=ON

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4

  # ── Address Sanitiser (MSVC ASAN) ─────────────────────────────────────
  asan:
    name: ASAN (MSVC Debug)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DPS5X_BUILD_TESTS=ON `
            -DPS5X_ENABLE_ASAN=ON `
            -DPS5X_ENABLE_DX12=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test (ASAN)
        working-directory: build
        run: ctest -C Debug --output-on-failure --parallel 2

  # ── Static analysis (clang-tidy + clang-format) ───────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + LLVM
        run: |
          choco install ninja llvm -y

      - name: Configure (export compile commands)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Debug ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ^
            -DPS5X_BUILD_TESTS=ON ^
            -DPS5X_ENABLE_DX12=ON

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel

      - name: clang-format check
        shell: bash
        run: |
          find source tests -name '*.cpp' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

      - name: clang-tidy
        shell: bash
        run: |
          find source/ps5x/src -name '*.cpp' | \
            xargs clang-tidy -p build --warnings-as-errors='*'

  # ── Lint (CMake + spelling) ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Check CMake formatting
        run: |
          pip install cmakelang
          cmakelint CMakeLists.txt source/ps5x/CMakeLists.txt tests/CMakeLists.txt

  # ── Release artifacts ─────────────────────────────────────────────────
  release:
    name: Release Package (Windows x64)
    runs-on: windows-2022
    needs: [build-test-msvc, build-test-clang, static-analysis]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release, MSVC)
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPS5X_BUILD_TESTS=ON `
            -DPS5X_WARNINGS_AS_ERRORS=ON `
            -DPS5X_ENABLE_DX12=ON `
            -DPS5X_ENABLE_DX11=ON `
            -DPS5X_ENABLE_CRASH_HANDLER=ON `
            -DPS5X_ENABLE_METRICS=ON `
            -DPS5X_ENABLE_SAVESTATES=ON `
            -DPS5X_ENABLE_INPUT_MAPPING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          DIST=ps5x-${VERSION}-windows-x64
          mkdir -p dist/$DIST/bin dist/$DIST/docs dist/$DIST/config
          cp build/Release/ps5x.exe dist/$DIST/bin/ 2>/dev/null || \
            cp build/ps5x.exe       dist/$DIST/bin/ 2>/dev/null || true
          cp README.md CHANGELOG.md ROADMAP.md ARCHITECTURE.md \
             BUILD.md CONTRIBUTING.md SECURITY.md dist/$DIST/docs/
          cp ps5x.toml.template dist/$DIST/config/ps5x.toml
          cd dist && 7z a ../${DIST}.zip $DIST
          echo "ARTIFACT=${DIST}.zip" >> $GITHUB_ENV

      - name: Generate SBOM
        shell: bash
        run: |
          echo "# PS5x v1.0.0 Software Bill of Materials" > SBOM.md
          echo "" >> SBOM.md
          echo "| Component | Version | License |" >> SBOM.md
          echo "|-----------|---------|---------|" >> SBOM.md
          echo "| PS5x | 1.0.0 | MIT |" >> SBOM.md
          echo "| Kyty (upstream reference) | - | MIT |" >> SBOM.md
          echo "| Catch2 | 3.5.4 | BSL-1.0 |" >> SBOM.md
          echo "| DirectX 12 SDK | system | MIT |" >> SBOM.md
          echo "| DirectX 11 SDK | system | MIT |" >> SBOM.md
          echo "| DbgHelp | system | MIT |" >> SBOM.md

      - name: Generate release notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | head -n -1 > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            ${{ env.ARTIFACT }}
            SBOM.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
